name: Refresh dashboard

on:
  schedule:
    - cron: '15 */3 * * *'   # every 3 hours (UTC)
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check connections
        run: node scripts/check.mjs
        env:
          HCP_API_KEY: ${{ secrets.HCP_API_KEY }}
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}

      - name: Build and encrypt
        run: node scripts/build.mjs
        env:
          HCP_API_KEY: ${{ secrets.HCP_API_KEY }}
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}

      - name: Deploy to Netlify
        run: npx --yes netlify-cli@17 deploy --prod --dir=public --message "refresh ${{ github.run_number }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
