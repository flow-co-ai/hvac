<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Quality HVAC by Fibid, business report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1622; --navy2:#13233a; --ink:#0f1b2a; --muted:#64748b; --paper:#f4f8fb; --card:#fff; --line:#e3ebf2; --line2:#eef3f8;
  --sky:#35aef0; --sky-d:#1592d8; --sky-soft:#e6f5fd; --flame:#f26b1d; --flame-soft:#fff0e6;
  --up:#16a34a; --down:#dc2626; --adj:#e08a00; --steel:#94a3b8;
  --c1:#35aef0; --c2:#f26b1d; --c3:#16a34a; --c4:#7c5cff; --c5:#0fb5ae; --c6:#b8c4d1; --c7:#e0a100;
  --disp:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif; --body:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
header.top{background:#fff;padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px}
.brand img{height:48px;width:auto;display:block}
.brand div{border-left:1px solid var(--line);padding-left:16px;line-height:1.25}
.brand b{display:block;font-weight:600;font-size:15px}
.brand small{color:var(--muted);font-size:13px}
.ranges{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
.ranges button{background:none;border:0;padding:8px 14px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.ranges button[aria-pressed=true]{background:var(--sky);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(53,174,240,.35)}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 14px 11px;font-size:15.5px;font-weight:500;color:var(--ink);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--sky-d);border-bottom-color:var(--sky);font-weight:600}
nav.tabs button:focus{outline:none}nav.tabs button:focus-visible{outline:2px solid var(--sky);outline-offset:-6px;border-radius:10px}
.hero{background:radial-gradient(1200px 400px at 85% -10%,#1d3a5c 0,transparent 60%),var(--navy);color:#fff;padding:34px 0 96px}
.period{font-size:13.5px;color:#9fb3c8;margin:0 0 10px;display:inline-flex;align-items:center;gap:8px;border:1px solid #2a3d55;border-radius:99px;padding:5px 14px}
.period:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sky)}
h2.head{font-family:var(--disp);font-weight:700;font-size:clamp(32px,4.4vw,52px);line-height:1.05;margin:6px 0 16px;max-width:24ch;letter-spacing:-1px;text-wrap:balance}
h2.head span{color:var(--sky);display:block}
.brief{margin:0;padding:0;list-style:none;max-width:70ch;color:#c9d6e3;font-size:16px}
.brief li{padding-left:18px;position:relative;margin:5px 0;text-wrap:pretty}
.brief li:before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:#5b708a}
.brief li.good:before{background:#34d399}.brief li.bad:before{background:#f87171}.brief li.adj:before{background:var(--flame)}
main.wrap{margin-top:-68px;padding-bottom:56px;position:relative}
.view{display:none}.view.on{display:block}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 12px;min-width:0;box-shadow:0 10px 30px -18px rgba(11,22,34,.35)}
.stat .k{font-size:13.5px;color:var(--muted);line-height:1.25;font-weight:500}
.stat .v{font-weight:700;font-size:34px;line-height:1.05;margin:6px 0 4px;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.stat .d{font-size:12.5px;color:var(--muted);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d .up{color:var(--up);font-weight:600}.d .down{color:var(--down);font-weight:600}
.stat svg{display:block;width:100%;height:28px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px 18px;min-width:0}
.panel h3{font-weight:600;font-size:20px;margin:0 0 3px;line-height:1.2;letter-spacing:-.3px}
.panel .sub{font-size:13.5px;color:var(--muted);margin:0 0 14px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--body);font-size:11.5px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
td{text-align:right;padding:11px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
tr.sep td{color:var(--muted);font-size:13px;padding-top:16px;border-bottom:1px solid var(--line)}
tr.tot td{font-weight:700;background:var(--sky-soft);border-bottom:0}
tr.tot td:first-child{padding-left:12px;border-radius:10px 0 0 10px}tr.tot td:last-child{border-radius:0 10px 10px 0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.pill.up{background:#e6f7ec;color:var(--up)}.pill.down{background:#fdeaea;color:var(--down)}.pill.adj{background:var(--flame-soft);color:#c25010}.pill.n{background:#eef3f8;color:var(--muted)}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.todo li{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbfdff}
.todo b{display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;background:var(--sky-soft);color:var(--sky-d);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.todo b.hot{background:var(--flame-soft);color:var(--flame)}
.todo span{font-size:15px;font-weight:600;line-height:1.3}.todo small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:3px;line-height:1.4}
.todo a{color:var(--sky-d);font-weight:500}
.lst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.lcard .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:14.5px}
.lcard .row:last-of-type{border:0}
.lcard svg{display:block;width:100%;height:36px;margin-top:10px}
.lcard .big{font-weight:700;font-size:32px;line-height:1;letter-spacing:-.6px}
.rank{display:grid;grid-template-columns:40px minmax(0,1fr) 72px 96px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14.5px}
.rank .p{display:flex;align-items:center;justify-content:center;height:32px;border-radius:9px;background:var(--sky-soft);color:var(--sky-d);font-weight:700;font-size:15px}
.rank.sd{grid-template-columns:40px minmax(0,1fr) 84px}
.rank .q{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .c{text-align:right;font-size:13px}
.rank svg{width:96px;height:24px}
.grp{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 2px}
.more{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-top:12px;cursor:pointer;font-size:14px;font-weight:500}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.sitepick{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}.sitepick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font-weight:500;cursor:pointer}.sitepick button.on{background:var(--sky);border-color:var(--sky);color:#fff}.sitepick button:disabled{cursor:default;color:var(--muted)}.sitepick em{font-style:normal;font-size:12px;margin-left:4px}
.row2{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14.5px}
.money{background:linear-gradient(135deg,var(--navy),#1d3a5c);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.money div{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.money span{font-size:13.5px;color:#b9cadb}.money b{font-size:28px;font-weight:700;letter-spacing:-.6px}.money small{display:block;color:#b9cadb;font-size:12.5px;margin-top:4px;line-height:1.4}
.hb{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 70px;gap:12px;align-items:center;padding:7px 0;font-size:14.5px}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb div{background:#eef3f8;border-radius:99px;height:10px}.hb i{display:block;height:100%;border-radius:99px}.hb b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:36px repeat(24,minmax(0,1fr));gap:3px;font-size:11px;color:var(--muted)}
.heat div{aspect-ratio:1/1;border-radius:4px;min-width:0}
.heat .lab{aspect-ratio:auto;display:flex;align-items:center}
.heat .hr{aspect-ratio:auto;text-align:center}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split .box{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fbfdff}
.split .box .k{font-size:13px;color:var(--muted)}
.split .box .v{font-size:32px;font-weight:700;line-height:1.15;letter-spacing:-.6px}
.split .box small{color:var(--muted)}
footer.wrap{font-size:13px;color:var(--muted);padding-top:20px;padding-bottom:40px;border-top:1px solid var(--line)}
footer p{margin:4px 0;max-width:90ch}
#gate{position:fixed;inset:0;background:radial-gradient(900px 500px at 80% 0,#1d3a5c 0,transparent 60%),var(--navy);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
#gate form{background:#fff;border-radius:22px;padding:30px;width:100%;max-width:380px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
#gate img{height:56px;display:block;margin-bottom:18px}
#gate h1{font-weight:700;font-size:22px;margin:0 0 4px;letter-spacing:-.3px}
#gate p{margin:0 0 16px;color:var(--muted);font-size:14.5px}
#gate input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;margin-bottom:12px;background:var(--paper)}
#gate button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--sky);color:#fff;font-weight:600;font-size:15.5px;cursor:pointer}
#gate .err{color:var(--down);font-size:13.5px;min-height:20px;margin:8px 0 0}
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}.lst{grid-template-columns:1fr}}
@media (max-width:560px){.wrap{padding:0 16px}.brand img{height:38px}.brand div{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat:last-child:nth-child(odd){grid-column:span 2}.stat .v{font-size:28px}.ranges{width:100%}.ranges button{flex:1;padding:7px 4px;font-size:13px}.rank{grid-template-columns:34px minmax(0,1fr) 58px}.rank svg{display:none}.heat{font-size:9px;gap:2px}.split{grid-template-columns:1fr}.panel{padding:18px 16px 14px}.hero{padding:26px 0 84px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.open{cursor:pointer}
button.open{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box}
.todo li.open:hover,.todo li.open:focus-visible{border-color:var(--sky);background:#f5fbff}
.todo .go{font-style:normal;font-size:13px;color:var(--sky-d);font-weight:600;white-space:nowrap}
.todo li{grid-template-columns:62px 1fr auto}
tr.open:hover td{background:#f5fbff}
tr.open td:last-child:after{content:"›";color:var(--sky-d);font-weight:700;margin-left:8px}
.hb.open:hover span{color:var(--sky-d)}
.stat.open:hover{border-color:var(--sky)}
.stat .go{font-size:12.5px;color:var(--sky-d);font-weight:600}
.extrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.extbtn{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;text-decoration:none;padding:8px 12px;border-radius:10px;border:1px solid var(--line)}
.extbtn.hcp{background:#fff;color:var(--sky-d);border-color:#bfe3f8}.extbtn.hcp:hover{background:var(--sky-soft)}
.extbtn.ghl{background:#fff;color:#5b47d6;border-color:#d9d3fb}.extbtn.ghl:hover{background:#f3f1ff}
.linkbtn{background:var(--sky-soft);color:var(--sky-d);border:0;border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#scrim{position:fixed;inset:0;background:rgba(11,22,34,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:#fff;z-index:31;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(11,22,34,.4);padding-top:env(safe-area-inset-top)}
body.dr #scrim{opacity:1;pointer-events:auto}body.dr #drawer{transform:none}body.dr{overflow:hidden}
.dh{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dh h4{margin:0;font-size:21px;font-weight:700;letter-spacing:-.3px;padding-right:44px}
.dh p{margin:4px 0 12px;color:var(--muted);font-size:13.5px}
.dh input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--paper)}
.dh .x{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;line-height:1;cursor:pointer}
.dsum{display:flex;gap:18px;margin-top:12px;font-size:13.5px;color:var(--muted)}.dsum b{color:var(--ink);font-size:16px}
.dl{overflow-y:auto;padding:6px 22px 30px;flex:1}
.di{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:13px 0;border-bottom:1px solid var(--line2)}
.di .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.di .vl{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.di .mt{grid-column:1/-1;font-size:13px;color:var(--muted)}
.di .ln{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.di .ln a{font-size:12.5px;font-weight:600;text-decoration:none;padding:4px 10px;border-radius:8px}
.ln .hcp{background:var(--sky-soft);color:var(--sky-d)}.ln .ghl{background:#eef0ff;color:#5b47d6}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:#eef3f8;color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.ok{background:#e6f7ec;color:var(--up)}.tag.warn{background:var(--flame-soft);color:#c25010}
.dempty{color:var(--muted);padding:30px 0;text-align:center}
@media (prefers-reduced-motion:reduce){#drawer,#scrim{transition:none}}
</style>
</head>

<script>
(() => {
'use strict';
let D = null, R = 'month', V = 'pulse';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt$ = (v) => v == null || isNaN(v) ? '—' : Math.abs(v) >= 1e6 ? '$' + (v / 1e6).toFixed(2).replace(/0$/, '') + 'M' : (Math.abs(v) >= 100000 ? '$' + (v / 1000).toFixed(0) + 'K' : Math.abs(v) >= 10000 ? '$' + (v / 1000).toFixed(1) + 'K' : '$' + Math.round(v).toLocaleString());
const fmtN = (v) => v == null || isNaN(v) ? '—' : Math.round(v).toLocaleString();
const pct = (v) => v == null || !isFinite(v) ? '—' : Math.round(v * 100) + '%';
const sum = (a, i0, i1) => { let s = 0; for (let i = Math.max(0, i0); i <= i1 && i < a.length; i++) s += a[i] || 0; return s; };
const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const mLabel = (m) => MN[+m.slice(5, 7) - 1];
const mTick = (m, i) => (i === 0 || m.endsWith('-01')) ? `${mLabel(m)} ’${m.slice(2, 4)}` : mLabel(m);
const mLong = (m) => ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][+m.slice(5, 7) - 1];
const COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)', 'var(--c7)'];

// ---------- decrypt ----------
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(pass) {
  const r = await fetch('data.enc.json', { cache: 'no-store' });
  if (!r.ok) throw new Error('Data file not found. The latest build may still be running.');
  const e = await r.json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(e.salt), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  let plain;
  try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(e.iv) }, key, b64(e.ct)); } catch { throw new Error('That password didn’t work.'); }
  const txt = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
async function load(pass) {
  if (pass == null) { // unencrypted preview
    const r = await fetch('data.json', { cache: 'no-store' }); if (r.ok) return r.json(); return null;
  }
  return decrypt(pass);
}
$('#gateForm').addEventListener('submit', async (ev) => {
  ev.preventDefault(); $('#gateErr').textContent = 'Opening…';
  try { D = await load($('#pw').value); sessionStorage.setItem('hvac_pw', $('#pw').value); start(); }
  catch (e) { $('#gateErr').textContent = e.message; }
});
(async () => {
  try { const pre = await load(null); if (pre) { D = pre; return start(); } } catch {}
  const s = sessionStorage.getItem('hvac_pw');
  if (s) { try { D = await load(s); start(); } catch { sessionStorage.removeItem('hvac_pw'); } }
})();

// ---------- ranges ----------
function range() {
  const days = D.days, n = days.length, t = n - 1, today = D.meta.today;
  const idxOf = (d) => { let lo = 0; for (let i = 0; i < n; i++) if (days[i] >= d) return i; return lo; };
  const mStart = today.slice(0, 8) + '01';
  if (R === 'month') {
    const i0 = idxOf(mStart), len = t - i0 + 1;
    const pm = prevMonth(today.slice(0, 7)); const p0 = idxOf(pm + '-01'); const p1 = i0 - 1;
    return { i0, i1: t, p0, p1: Math.min(p1, p0 + len - 1), label: mLong(today) + ' to date', short: 'this month so far', vs: `vs ${mLabel(pm)} 1–${len}`, partial: true, months: [today.slice(0, 7)], fullPrev: [p0, p1] };
  }
  if (R === 'last') {
    const pm = prevMonth(today.slice(0, 7)); const i0 = idxOf(pm + '-01'), i1 = idxOf(mStart) - 1;
    const ppm = prevMonth(pm); const p0 = idxOf(ppm + '-01');
    return { i0, i1, p0, p1: i0 - 1, label: mLong(pm), short: 'in ' + mLong(pm), vs: 'vs ' + mLong(ppm), months: [pm] };
  }
  const L = +R; const i0 = Math.max(0, n - L), p1 = i0 - 1, p0 = Math.max(0, p1 - L + 1);
  return { i0, i1: t, p0, p1, label: L === 90 ? 'Last 90 days' : 'Last 12 months', short: L === 90 ? 'over the last 90 days' : 'over the last 12 months', vs: p1 - p0 + 1 >= L ? (L === 90 ? 'vs the prior 90 days' : 'vs the prior year') : null, months: monthsIn(days[i0], today) };
}
function prevMonth(m) { let [y, mo] = m.split('-').map(Number); mo--; if (!mo) { mo = 12; y--; } return `${y}-${String(mo).padStart(2, '0')}`; }
function monthsIn(a, b) { const out = []; let m = a.slice(0, 7); while (m <= b.slice(0, 7)) { out.push(m); let [y, mo] = m.split('-').map(Number); mo++; if (mo > 12) { mo = 1; y++; } m = `${y}-${String(mo).padStart(2, '0')}`; } return out; }
const S = (arr, rg, prev) => prev ? (rg.p1 >= rg.p0 && rg.vs ? sum(arr, rg.p0, rg.p1) : null) : sum(arr, rg.i0, rg.i1);
function delta(cur, prev, rg, inverse) {
  if (prev == null || !rg.vs) return '';
  if (!prev) return cur ? `<span>${rg.vs}: new</span>` : '';
  const ch = (cur - prev) / prev; const good = inverse ? ch < 0 : ch > 0;
  if (Math.abs(ch) < 0.02) return `<span>flat ${rg.vs}</span>`;
  return `<span class="${good ? 'up' : 'down'}">${ch > 0 ? '▲' : '▼'} ${Math.abs(Math.round(ch * 100))}%</span> <span>${rg.vs}</span>`;
}
// last-12-months monthly totals for a daily array
function monthly(arr) {
  const out = {}; D.days.forEach((d, i) => { const m = d.slice(0, 7); out[m] = (out[m] || 0) + (arr[i] || 0); });
  return monthsIn(D.days[Math.max(0, D.days.length - 365)], D.meta.today).map((m) => ({ m, v: out[m] || 0 }));
}
function weekly(arr, weeks = 13) {
  const n = D.days.length, out = [];
  for (let w = weeks - 1; w >= 0; w--) { const i1 = n - 1 - w * 7, i0 = i1 - 6; out.push({ d: D.days[Math.max(0, i0)], v: sum(arr, i0, i1) }); }
  return out;
}

// ---------- svg helpers ----------

  document.querySelectorAll('.ranges button').forEach((b) => b.onclick = () => { R = b.dataset.r; document.querySelectorAll('.ranges button').forEach((x) => x.setAttribute('aria-pressed', x === b)); render(); });
  document.querySelectorAll('nav.tabs button').forEach((b) => b.onclick = () => { V = b.dataset.v; document.querySelectorAll('nav.tabs button').forEach((x) => x.setAttribute('aria-selected', x === b)); document.querySelectorAll('.view').forEach((s) => s.classList.toggle('on', s.id === 'v-' + V)); render(); window.scrollTo({ top: 0 }); });
  render();
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 200); });
}
})();
</script>
